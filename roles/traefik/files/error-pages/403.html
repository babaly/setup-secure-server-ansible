<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès bloqué — Solution Plus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 600px;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 200px;
      margin-bottom: 3rem;
      filter: drop-shadow(0 4px 24px rgba(245,166,35,0.3));
    }
    .shield {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      display: block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #F5A623, #4ECDC4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .code {
      font-size: 5rem;
      font-weight: 900;
      color: #F5A623;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    p {
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(245,166,35,0.1);
      border: 1px solid rgba(245,166,35,0.3);
      border-radius: 50px;
      padding: 0.6rem 1.4rem;
      font-size: 0.9rem;
      color: #F5A623;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #F5A623;
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .footer {
      margin-top: 4rem;
      color: #4b5563;
      font-size: 0.8rem;
    }
    .footer a {
      color: #4ECDC4;
      text-decoration: none;
    }
  </style>
</head>
